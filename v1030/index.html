<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>五子棋 · AI 对弈</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e9dcc0'/%3E%3Ccircle cx='11' cy='16' r='5' fill='%2317191b'/%3E%3Ccircle cx='21' cy='16' r='5' fill='%23fff' stroke='%2317191b' stroke-width='1.5'/%3E%3C/svg%3E">
    <style>
        /* 方向：framed-sheet（边框 + 白纸面）。产品面孔：边框取棋盘材料色（暖纸），
           数据色只用唯一青绿（--accent）——最后一手标记与链接。字体自托管（OFL）。 */
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('../fonts/ibmplexsans-400.woff2') format('woff2'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('../fonts/ibmplexsans-500.woff2') format('woff2'); }
        @font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 600; font-display: swap; src: url('../fonts/ibmplexsans-600.woff2') format('woff2'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('../fonts/ibmplexmono-400.woff2') format('woff2'); }
        @font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('../fonts/ibmplexmono-500.woff2') format('woff2'); }

        :root {
            --ground: #f2f3f1;
            --surface: #ffffff;
            --raised: #f4f6f8;
            --active: #ebedee;
            --border: #e8eaec;
            --rule: #f0f1f2;
            --control: #cdced1;
            --text: #131416;
            --muted: #5d5f60;
            --accent: #1b6c80;
            --wood: #e9dcc0;
            --pill-neutral-bg: #ebedee;
            --pill-neutral-ink: #353736;
            --radius-card: 8px;
            --radius-control: 6px;
            --radius-sheet: 16px;
            --pad: 24px;
            --font-text: "IBM Plex Sans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-text);
            font-size: 14px;
            color: var(--text);
            background: var(--ground);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ===== 顶栏（48px，与边框同色，无分隔线） ===== */
        .topbar { height: 48px; flex: none; display: flex; align-items: center; }
        .topbar-inner { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 var(--pad); }
        .wordmark { font-size: 16px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
        .wordmark-sub { font-size: 12px; font-weight: 400; color: var(--muted); }
        .topbar-right { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .build { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
        .status { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 12px; border-radius: 999px; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); font-size: 13px; white-space: nowrap; }
        .status .turn-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #17191b; border: 1px solid rgba(0,0,0,.35); }
        .status .turn-indicator.white { background: #fff; border-color: rgba(0,0,0,.28); }
        .thinking { color: var(--accent); animation: think 1.4s ease-in-out infinite; }
        @keyframes think { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
        .winner-msg { font-weight: 600; color: var(--text); }

        /* ===== 边框与白纸面 ===== */
        .frame { flex: 1; display: flex; min-height: 0; flex-direction: column; }
        .sheet { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sheet); margin: 0 8px 8px; padding: var(--pad); }
        .sheet-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--pad); align-items: start; }

        /* ===== 棋盘面板 ===== */
        .board-panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .board-wrap { display: flex; justify-content: center; }
        #board { display: block; max-width: 100%; background: var(--wood); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        .board-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
        .mode-info { color: var(--muted); }

        /* ===== 右栏 ===== */
        .rail { display: flex; flex-direction: column; min-width: 0; border-left: 1px solid var(--rule); padding-left: var(--pad); }
        .rail-block { padding: 16px 0; border-top: 1px solid var(--rule); }
        .rail-block:first-child { border-top: none; padding-top: 0; }
        .rail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .rail-head h2 { font-size: 16px; font-weight: 600; }
        .rail-note { font-size: 13px; color: var(--muted); }

        /* 胜率条（黑/白分段 = 双方） */
        .bar-wrap { height: 8px; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; display: flex; background: var(--surface); }
        .seg { height: 100%; flex: 0 0 auto; }
        .seg.black { background: #17191b; }
        .seg.white { background: #ffffff; }
        .wr-text { margin-top: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

        /* 搜索统计：一格四分栏 */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: var(--radius-card); margin-top: 16px; }
        .stat { padding: 10px 12px; border-left: 1px solid var(--rule); min-width: 0; }
        .stat:first-child { border-left: none; }
        .stat-k { display: block; font-size: 13px; color: var(--muted); }
        .stat-v { display: block; margin-top: 2px; font-size: 18px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }

        /* 棋谱 */
        .kifu { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-card); }
        .kifu-row { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px; border-top: 1px solid var(--rule); font-size: 13px; }
        .kifu-row:first-child { border-top: none; }
        .kifu-row.current { background: var(--raised); }
        .kifu-n { width: 22px; text-align: right; color: var(--muted); font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
        .kifu-stone { width: 10px; height: 10px; border-radius: 50%; flex: none; background: #17191b; border: 1px solid rgba(0,0,0,.35); }
        .kifu-stone.white { background: #fff; border-color: rgba(0,0,0,.28); }
        .kifu-coord { width: 44px; font-weight: 500; }
        .kifu-note { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
        .kifu-empty { padding: 16px 12px; color: var(--muted); font-size: 13px; }

        /* 设置与控制 */
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        select { width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit; }
        select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        .btn-group { display: flex; gap: 8px; }
        .btn-group + .btn-group { margin-top: 8px; }
        button { flex: 1; height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-control); background: #131416; color: #fff; font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; white-space: nowrap; }
        button:hover { background: #26282a; }
        button:active { background: #0b0c0d; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        button.secondary { background: var(--surface); border-color: var(--control); color: var(--text); }
        button.secondary:hover { background: var(--raised); }
        button.secondary:active { background: var(--active); }

        /* 版本行（页脚） */
        .version-row { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
        .version-row a { color: var(--accent); text-decoration: none; }
        .version-row a:hover { text-decoration: underline; }
        .version-row b { font-weight: 600; color: var(--text); }

        /* ===== 响应式：窄屏抽掉侧栏，纸面即屏幕 ===== */
        @media (max-width: 1060px) {
            .topbar-inner { padding: 0 16px; }
            .sheet { margin: 0 8px 8px; padding: 16px; }
            .sheet-grid { grid-template-columns: 1fr; gap: 8px; }
            .rail { border-left: none; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 8px; }
            .build { display: none; }
        }
        @media (max-width: 420px) {
            .wordmark-sub { display: none; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .stat:nth-child(3) { border-left: none; }
            .stat:nth-child(n+3) { border-top: 1px solid var(--rule); }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <h1 class="wordmark">五子棋 <span class="wordmark-sub">AI 对弈</span></h1>
            <div class="topbar-right">
                <div class="status" id="status">
                    <span class="turn-indicator black"></span>
                    黑棋先手
                </div>
                <span class="build" id="build-id">-</span>
            </div>
        </div>
    </header>

    <div class="frame">
        <main class="sheet">
            <div class="sheet-grid">
                <section class="board-panel">
                    <div class="board-wrap">
                        <canvas id="board" width="600" height="600"></canvas>
                    </div>
                    <div class="board-foot">
                        <span class="mode-info"><span id="mode-text">人机对战模式</span></span>
                        <span>你执黑先手，点击棋盘落子</span>
                    </div>
                </section>

                <aside class="rail">
                    <section class="rail-block">
                        <div class="rail-head">
                            <h2>对局</h2>
                            <span class="rail-note">胜率由引擎评估</span>
                        </div>
                        <div class="win-rate">
                            <div class="bar-wrap">
                                <span class="seg black" id="wr-black" style="width:50%"></span>
                                <span class="seg white" id="wr-white" style="width:50%"></span>
                            </div>
                            <div class="wr-text" id="wr-text">黑 50% · 白 50%</div>
                        </div>
                        <div class="stats" id="stats">
                            <div class="stat"><span class="stat-k">步数</span><span class="stat-v" id="move-count">0</span></div>
                            <div class="stat"><span class="stat-k">搜索深度</span><span class="stat-v" id="search-depth">-</span></div>
                            <div class="stat"><span class="stat-k">节点数</span><span class="stat-v" id="node-count">-</span></div>
                            <div class="stat"><span class="stat-k">思考时间</span><span class="stat-v"><span id="think-time">-</span><span style="font-size:12px;color:var(--muted)"> ms</span></span></div>
                        </div>
                    </section>

                    <section class="rail-block">
                        <div class="rail-head">
                            <h2>棋谱</h2>
                            <span class="rail-note">白棋附搜索印记</span>
                        </div>
                        <div class="kifu" id="kifu-list">
                            <div class="kifu-empty">还没有落子。你执黑先手。</div>
                        </div>
                    </section>

                    <section class="rail-block">
                        <div class="rail-head">
                            <h2>设置</h2>
                        </div>
                        <div class="control-group">
                            <label for="mode-select">游戏模式</label>
                            <select id="mode-select">
                                <option value="human">人机对战</option>
                                <option value="ai-vs-ai">机机对战</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label for="difficulty-select">AI 难度</label>
                            <select id="difficulty-select">
                                <option value="0">简单</option>
                                <option value="1" selected>中等</option>
                                <option value="2">困难</option>
                            </select>
                        </div>
                        <div class="control-group" id="speed-group" style="display:none;">
                            <label>对局速度: <span id="speed-value">500</span> ms</label>
                            <input type="range" id="speed-slider" min="100" max="2000" value="500" step="100">
                        </div>
                        <div class="btn-group">
                            <button id="new-game-btn">新游戏</button>
                            <button id="undo-btn" class="secondary">悔棋</button>
                            <button id="copy-record-btn" class="secondary">复制棋谱</button>
                        </div>
                        <div class="btn-group">
                            <button id="pause-btn" class="secondary" style="display:none;">暂停</button>
                            <button id="speed-up-btn" class="secondary" style="display:none;">加速</button>
                        </div>
                    </section>

                    <section class="rail-block">
                        <div class="version-row" id="version-row"></div>
                    </section>
                </aside>
            </div>
        </main>
    </div>

    <script>
        // 构建号：发布须知——改这里时，必须把下方引擎脚本引用的 ?v= 参数一起改，两者保持一致。
        window.__GOMOKU_BUILD__ = '20261031d（引擎 10.30）';
        window.Module = window.Module || {};

        // 引擎就绪桥接。引擎异步实例化 WASM，缓存命中时它可能在本页面后续脚本
        // 挂上 onRuntimeInitialized 之前就跑完 run()，那时回调尚未赋值、之后
        // 永不触发（表现为棋盘能读引擎但整页无法落子）。所以在引擎脚本之前
        // 先接管这个回调，并记录就绪时刻，两种先后顺序都能收敛到同一个入口。
        window.__engineReady = false;
        window.__engineReadyHook = null;
        window.Module.onRuntimeInitialized = function() {
            window.__engineReady = true;
            if (window.__engineReadyHook) window.__engineReadyHook();
        };

        // 在统计面板里显示构建号，方便核对当前运行的是哪个版本。
        var _buildEl = document.getElementById('build-id');
        if (_buildEl) _buildEl.textContent = window.__GOMOKU_BUILD__;

        // 版本选择行：可在「最新 / 10.30 / 10.18」三个引擎之间切换试玩。
        // 子目录（/v1018/、/v1030/）里用 ../ 相对路径返回根目录。
        (function() {
            var row = document.getElementById('version-row');
            if (!row) return;
            var m = location.pathname.match(/\/(v\d{4})\/?$/);
            var cur = m ? m[1] : '';
            var base = cur ? '../' : './';
            var items = [['', '最新版'], ['v1030', '10.30 版'], ['v1018', '10.18 版']];
            var html = '对手版本：';
            for (var i = 0; i < items.length; i++) {
                var v = items[i][0];
                if (i) html += ' · ';
                if (v === cur) {
                    html += '<b>【' + items[i][1] + '】</b>';
                } else {
                    html += '<a href="' + base + (v ? v + '/' : '') + '">' + items[i][1] + '</a>';
                }
            }
            row.innerHTML = html;
        })();
    </script>
<script src="gomoku.js"></script>
    <script>
        // ============= 全局状态 =============
        let moduleReady = false;
        let gameState = 'playing';  // playing, black-wins, white-wins, draw
        let gameMode = 'human';    // human, ai-vs-ai
        let isAIThinking = false;
        let aiVsAIPaused = false;
        let aiVsAISpeed = 500;     // ms per move
        let aiVsAITimer = null;
        let moveHistory = [];  // 棋谱记录 [{x, y, player, moveNum, stats?}]（stats 为 AI 搜索统计）
        let gameEvents = [];   // 对局内事件（悔棋等），记入棋谱以还原会话过程
        let difficultyLog = [];  // 本局难度生效区间 [{ply, label}]，供棋谱还原真实难度
        // 对局代次：newGame/undo 时递增，用于作废已调度但尚未执行的 AI 回调，
        // 防止旧棋盘快照与新棋盘做 diff 时产生幽灵棋谱记录
        let gameGen = 0;
        
        // 棋盘渲染参数
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const BOARD_SIZE = 15;
        const CELL_SIZE = 40;
        const PADDING = 20;
        const CANVAS_SIZE = CELL_SIZE * (BOARD_SIZE - 1) + PADDING * 2;
        // 逻辑坐标 → 画布像素的缩放系数。绘制代码统一使用 600x600 逻辑坐标，
        // 由 ctx.setTransform 映射到实际像素，手机上高分屏也不会糊。
        let boardScale = 1;
        let resizePending = false;

        // 按视口算出棋盘的 CSS 显示边长：窄屏按宽度收敛（棋盘完整可见、不滚动），
        // 大屏按左栏宽度与可用高度放大（背板分辨率随显示尺寸缩放，不会糊）。
        function computeBoardDisplaySize() {
            const sideBySide = window.innerWidth > 1060;
            // 横向留给棋盘的宽度：大屏 = 窗口 − 纸面边距/内边距 − 右栏 − 栏距；
            // 窄屏 = 窗口 − 纸面边距/内边距。
            let available = window.innerWidth - (sideBySide ? 428 : 50);
            available = Math.min(available, sideBySide ? 900 : CANVAS_SIZE);
            const isShortLandscape = window.innerWidth > window.innerHeight &&
                                    window.innerHeight < 560;
            if (isShortLandscape) {
                available = Math.min(available, window.innerHeight - 80);
            } else if (sideBySide) {
                // 大屏：给顶栏、脚注行和纸面内边距留出高度，棋盘不把页面撑出滚动
                available = Math.min(available, window.innerHeight - 190);
            }
            return Math.max(240, Math.floor(available));
        }

        function resizeBoard() {
            const display = computeBoardDisplaySize();
            canvas.style.width = display + 'px';
            canvas.style.height = display + 'px';
            // 背板分辨率按显示尺寸 × 设备像素比，避免高分屏放大模糊
            const backing = Math.round(display * Math.min(window.devicePixelRatio || 1, 3));
            if (canvas.width !== backing) {
                canvas.width = backing;
                canvas.height = backing;
            }
            boardScale = canvas.width / CANVAS_SIZE;
            drawBoard();
        }

        function requestResize() {
            if (resizePending) return;
            resizePending = true;
            requestAnimationFrame(() => {
                resizePending = false;
                resizeBoard();
            });
        }

        // ============= 渲染函数 =============
        function drawBoard() {
            ctx.setTransform(boardScale, 0, 0, boardScale, 0, 0);
            ctx.fillStyle = '#e9dcc0';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            // 画网格线
            ctx.strokeStyle = '#ab9570';
            ctx.lineWidth = 1;
            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE);
                ctx.stroke();
            }
            
            // 画星位
            const stars = [[3,3], [3,11], [11,3], [11,11], [7,7]];
            ctx.fillStyle = '#ab9570';
            stars.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, 4, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // 画棋子
            if (moduleReady) {
                for (let y = 0; y < BOARD_SIZE; y++) {
                    for (let x = 0; x < BOARD_SIZE; x++) {
                        const cell = Module._getCell(x, y);
                        if (cell !== 0) {
                            drawStone(x, y, cell);
                        }
                    }
                }
            }
            
            // 最后一手：青绿圆点（全页唯一数据色）
            if (moduleReady && moveHistory.length > 0) {
                const lm = moveHistory[moveHistory.length - 1];
                ctx.beginPath();
                ctx.arc(PADDING + lm.x * CELL_SIZE, PADDING + lm.y * CELL_SIZE, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#1b6c80';
                ctx.fill();
            }
            
            // 高亮上一步落子（棋子中央画红色圆环，黑白子都清晰可见）
            if (moveHistory.length > 0) {
                const last = moveHistory[moveHistory.length - 1];
                const lx = PADDING + last.x * CELL_SIZE;
                const ly = PADDING + last.y * CELL_SIZE;
                ctx.beginPath();
                ctx.arc(lx, ly, 6, 0, Math.PI * 2);
                ctx.strokeStyle = '#e53935';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }
        
        function drawStone(x, y, player) {
            const cx = PADDING + x * CELL_SIZE;
            const cy = PADDING + y * CELL_SIZE;
            const radius = CELL_SIZE * 0.4;
            
            // 阴影
            ctx.beginPath();
            ctx.arc(cx + 2, cy + 2, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fill();
            
            // 棋子：扁平双色 + 细描边（不用渐变）
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = player === 1 ? '#17191b' : '#ffffff';
            ctx.fill();
            ctx.strokeStyle = player === 1 ? '#0a0b0c' : '#c2bcb0';
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        // ============= 游戏逻辑 =============
        function updateStatus() {
            if (!moduleReady) return;
            
            const status = Module._getGameStatus();
            const moveCount = Module._getMoveCount();
            const player = Module._getCurrentPlayer();
            
            document.getElementById('move-count').textContent = moveCount;
            
            if (status === 1) {
                gameState = 'black-wins';
                document.getElementById('status').innerHTML = 
                    '<span class="winner-msg">黑棋获胜</span>';
                document.getElementById('undo-btn').disabled = false;
                document.getElementById('new-game-btn').focus();
            } else if (status === 2) {
                gameState = 'white-wins';
                document.getElementById('status').innerHTML = 
                    '<span class="winner-msg">白棋获胜</span>';
                document.getElementById('undo-btn').disabled = false;
                document.getElementById('new-game-btn').focus();
            } else if (status === 3) {
                gameState = 'draw';
                document.getElementById('status').innerHTML = 
                    '<span class="winner-msg">平局！</span>';
                document.getElementById('undo-btn').disabled = false;
            } else {
                gameState = 'playing';
                const turnText = player === 1 ? '黑棋' : '白棋';
                const turnClass = player === 1 ? 'black' : 'white';
                let html = '<span class="turn-indicator ' + turnClass + '"></span>';
                if (isAIThinking) {
                    html += '<span class="thinking">AI 思考中...（预计' + estimateThinkText() + '）</span>';
                } else {
                    html += turnText + '回合';
                }
                document.getElementById('status').innerHTML = html;
            }
        }
        
        function updateStats(depth, nodes, time) {
            document.getElementById('search-depth').textContent = depth || '-';
            document.getElementById('node-count').textContent = nodes || '-';
            document.getElementById('think-time').textContent = time || '-';
        }
        
        // 棋谱：每手一行；白棋（AI）附上引擎搜索印记（深度 / 用时）
        function renderKifu() {
            const list = document.getElementById('kifu-list');
            if (!list) return;
            if (moveHistory.length === 0) {
                list.innerHTML = '<div class="kifu-empty">还没有落子。你执黑先手。</div>';
                return;
            }
            const coords = 'ABCDEFGHIJKLMNO';
            let html = '';
            for (const m of moveHistory) {
                const coord = coords[m.x] + (m.y + 1);
                const note = (m.player === 2 && m.stats)
                    ? ('d' + m.stats.depth + ' · ' + (Number(m.stats.time) / 1000).toFixed(1) + 's')
                    : '';
                html += '<div class="kifu-row' + (m.moveNum === moveHistory.length ? ' current' : '') + '">'
                     + '<span class="kifu-n">' + m.moveNum + '</span>'
                     + '<span class="kifu-stone ' + (m.player === 1 ? 'black' : 'white') + '"></span>'
                     + '<span class="kifu-coord">' + coord + '</span>'
                     + '<span class="kifu-note">' + note + '</span></div>';
            }
            list.innerHTML = html;
            list.scrollTop = list.scrollHeight;
        }
        
        // 胜率：引擎评分在 ±WIN_THRESHOLD(1000万) 之间，线性映射到 [0,1]
        function updateWinRate(score) {
            var p = 0.5 + Number(score) / (2 * 10000000);
            if (p < 0) p = 0;
            if (p > 1) p = 1;
            var b = Math.round(p * 100);
            var w = 100 - b;
            document.getElementById('wr-black').style.width = b + '%';
            document.getElementById('wr-white').style.width = w + '%';
            document.getElementById('wr-text').textContent = '黑 ' + b + '% · 白 ' + w + '%';
        }
        
        function makeHumanMove(x, y) {
            if (!moduleReady || gameState !== 'playing') return;
            if (isAIThinking) return;
            if (gameMode === 'ai-vs-ai') return;
            // 人类只允许在轮到黑棋时落子（防止连点把白棋也下了）
            if (Module._getCurrentPlayer() !== 1) return;
            
            const result = Module._playerMove(x, y);
            if (result !== -1) {
                const player = Module._getCurrentPlayer() === 1 ? 2 : 1;  // 落子前的玩家
                moveHistory.push({ x, y, player, moveNum: moveHistory.length + 1 });
                drawBoard();
                updateStatus();
                updateWinRate(Module._evaluateBoard());
                renderKifu();
                if (gameState === 'playing') {
                    // 如果是人机模式，轮到 AI 走
                    if (Module._getCurrentPlayer() === 2) {
                        const gen = gameGen;
                        setTimeout(() => aiMove(gen), 50);
                    }
                }
            }
        }
        
        function aiMove(expectedGen) {
            if (!moduleReady || gameState !== 'playing') return;
            if (aiVsAIPaused) return;
            if (isAIThinking) return;  // 防止重复调度导致 AI 连走两步
            // 过期的调度（其间发生过 newGame/undo）直接丢弃
            if (expectedGen !== undefined && expectedGen !== gameGen) return;
            // 人机模式下 AI 只允许在轮到白棋时走
            if (gameMode === 'human' && Module._getCurrentPlayer() !== 2) return;
            
            isAIThinking = true;
            updateStatus();
            
            // 记录 AI 落子前的棋盘状态
            const boardBefore = [];
            for (let y = 0; y < BOARD_SIZE; y++) {
                const row = [];
                for (let x = 0; x < BOARD_SIZE; x++) {
                    row.push(Module._getCell(x, y));
                }
                boardBefore.push(row);
            }
            
            // 使用 setTimeout 让 UI 更新
            const innerGen = gameGen;
            setTimeout(() => {
                // 快照已过期（其间发生过 newGame/undo）：放弃本手并复位思考标志
                if (innerGen !== gameGen) {
                    isAIThinking = false;
                    updateStatus();
                    return;
                }
                const player = Module._getCurrentPlayer();  // AI 落子前的玩家
                const result = Module._aiMove();
                isAIThinking = false;
                
                // 获取搜索统计（一并写入棋谱，供以后复盘：深度/节点/用时/评分）
                // 注意：Emscripten 的 long long 返回值是 BigInt，必须转 Number 后才能参与运算
                const depth = Number(Module._wasmGetLastSearchDepth());
                const nodes = Number(Module._wasmGetLastSearchNodes());
                const time = Number(Module._wasmGetLastSearchTimeMs());
                const score = String(Module._wasmGetLastSearchScore());
                
                // 找到 AI 最后落子的位置（对比前后棋盘）
                // 正常情况恰好差一个子；否则跳过记谱（宁可缺记，不可记错）
                if (result !== -1) {
                    const diffs = [];
                    for (let y = 0; y < BOARD_SIZE; y++) {
                        for (let x = 0; x < BOARD_SIZE; x++) {
                            if (Module._getCell(x, y) !== boardBefore[y][x]) {
                                diffs.push({ x, y });
                            }
                        }
                    }
                    if (diffs.length === 1) {
                        moveHistory.push({ x: diffs[0].x, y: diffs[0].y, player, moveNum: moveHistory.length + 1,
                                           stats: { depth, nodes, time, score } });
                    } else {
                        console.warn('AI move diff abnormal, skip record:', diffs.length);
                    }
                }
                
                drawBoard();
                updateStatus();
                updateStats(depth, nodes, time);
                updateWinRate(score);
                renderKifu();
                
                // 如果是机机对战，继续
                if (gameMode === 'ai-vs-ai' && gameState === 'playing') {
                    aiVsAITimer = setTimeout(aiMove, aiVsAISpeed);
                }
            }, 50);
        }
        
        function difficultyLabel() {
            const sel = document.getElementById('difficulty-select');
            return sel.options[sel.selectedIndex].text;
        }
        
        // 对局中提示：本难度下 AI 单步思考的大致耗时（困难档关键局面触发复核会更久）
        function estimateThinkText() {
            const v = parseInt(document.getElementById('difficulty-select').value);
            if (v === 0) return '约 1 秒';
            if (v === 1) return '约 3 秒';
            return '约 30 秒，关键局面更久';
        }
        
        function newGame() {
            if (!moduleReady) return;
            
            gameGen++;  // 作废所有待执行的 AI 回调
            Module._initGame();
            const difficulty = parseInt(document.getElementById('difficulty-select').value);
            Module._setDifficultyLevel(difficulty);
            
            gameState = 'playing';
            isAIThinking = false;
            aiVsAIPaused = false;
            moveHistory = [];  // 清空棋谱
            gameEvents = [];   // 清空会话事件
            difficultyLog = [{ ply: 1, label: difficultyLabel() }];
            
            if (aiVsAITimer) {
                clearTimeout(aiVsAITimer);
                aiVsAITimer = null;
            }
            
            drawBoard();
            updateStatus();
            updateStats(0, 0, 0);
            updateWinRate(0);
            renderKifu();
            
            // 如果是机机对战，自动开始
            if (gameMode === 'ai-vs-ai') {
                setTimeout(aiMove, 500);
            }
        }
        
        function undo() {
            if (!moduleReady) return;
            if (gameMode === 'ai-vs-ai') return;  // 机机对战不允许悔棋
            
            gameGen++;  // 作废所有待执行的 AI 回调（先作废，再改棋盘）
            // 悔棋两步（玩家一步 + AI 一步）
            const player = Module._getCurrentPlayer();
            if (player === 1) {
                // 轮到黑棋，说明 AI 刚走完，悔棋两步
                Module._undoN(2);
                if (moveHistory.length >= 2) {
                    moveHistory.pop();
                    moveHistory.pop();
                }
            } else {
                // 轮到白棋（AI），悔棋一步
                Module._undo();
                if (moveHistory.length >= 1) {
                    moveHistory.pop();
                }
            }
            gameEvents.push({ ply: moveHistory.length + 1, desc: '悔棋 ' + (player === 1 ? 2 : 1) + ' 步' });
            
            gameState = 'playing';
            drawBoard();
            updateStatus();
            renderKifu();
        }
        
        // ============= 事件监听 =============
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            // 棋盘按视口缩放显示，先把屏幕坐标换算回 600x600 逻辑坐标再定位格点
            const logicX = (e.clientX - rect.left) * (CANVAS_SIZE / rect.width);
            const logicY = (e.clientY - rect.top) * (CANVAS_SIZE / rect.height);
            const x = Math.round((logicX - PADDING) / CELL_SIZE);
            const y = Math.round((logicY - PADDING) / CELL_SIZE);

            if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
                makeHumanMove(x, y);
            }
        });

        window.addEventListener('resize', requestResize);
        window.addEventListener('orientationchange', () => setTimeout(requestResize, 150));
        
        // 难度立即生效：此前只有「新游戏」才读取下拉框，对局中途切换难度
        // 会静默失效——棋谱抬头却按显示值记录，导致记录与实际难度不符。
        // 因此同时记录难度变更点，让棋谱能还原每一手实际使用的难度。
        document.getElementById('difficulty-select').addEventListener('change', function() {
            if (!moduleReady) return;
            Module._setDifficultyLevel(parseInt(this.value));
            const label = this.options[this.selectedIndex].text;
            if (moveHistory.length === 0) {
                difficultyLog = [{ ply: 1, label: label }];  // 尚未落子，整局按新难度
            } else {
                difficultyLog.push({ ply: moveHistory.length + 1, label: label });
            }
        });
        
        document.getElementById('mode-select').addEventListener('change', function() {
            gameMode = this.value;
            document.getElementById('mode-text').textContent = 
                gameMode === 'human' ? '人机对战模式' : '机机对战模式';
            
            const speedGroup = document.getElementById('speed-group');
            const pauseBtn = document.getElementById('pause-btn');
            const speedUpBtn = document.getElementById('speed-up-btn');
            
            if (gameMode === 'ai-vs-ai') {
                speedGroup.style.display = 'block';
                pauseBtn.style.display = 'inline-block';
                speedUpBtn.style.display = 'inline-block';
            } else {
                speedGroup.style.display = 'none';
                pauseBtn.style.display = 'none';
                speedUpBtn.style.display = 'none';
            }
            
            newGame();
        });
        
        document.getElementById('speed-slider').addEventListener('input', function() {
            aiVsAISpeed = parseInt(this.value);
            document.getElementById('speed-value').textContent = aiVsAISpeed;
        });
        
        document.getElementById('new-game-btn').addEventListener('click', newGame);
        document.getElementById('undo-btn').addEventListener('click', undo);
        
        document.getElementById('copy-record-btn').addEventListener('click', function() {
            if (moveHistory.length === 0) {
                alert('还没有棋谱记录');
                return;
            }
            
            // 生成棋谱文本
            const coords = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
            let record = '五子棋对局记录\n';
            record += '================\n';
            record += `日期: ${new Date().toLocaleString()}\n`;
            record += `构建: ${window.__GOMOKU_BUILD__ || 'unknown'}\n`;
            record += `难度: ${difficultyLog.length ? difficultyLog[0].label : difficultyLabel()}\n`;
            for (let i = 1; i < difficultyLog.length; i++) {
                record += `难度变更: 第${difficultyLog[i].ply}手起 → ${difficultyLog[i].label}\n`;
            }
            record += `总步数: ${moveHistory.length}\n`;
            const statusCode = Module._getGameStatus();
            record += `结果: ${statusCode === 1 ? '黑棋胜' : statusCode === 2 ? '白棋胜' : statusCode === 3 ? '平局' : '未结束'}\n`;
            record += '================\n\n';
            
            for (let i = 0; i < moveHistory.length; i++) {
                const m = moveHistory[i];
                // 会话事件（悔棋等）标在下一手之前，便于还原真实对局过程
                for (const ev of gameEvents) {
                    if (ev.ply === m.moveNum) record += `—— 本手前：${ev.desc} ——\n`;
                }
                const playerStr = m.player === 1 ? '黑' : '白';
                const coord = coords[m.x] + (m.y + 1);
                let line = `${m.moveNum}. ${playerStr}棋 ${coord} (x:${m.x}, y:${m.y})`;
                if (m.stats) {
                    line += `  [深度${m.stats.depth} 节点${m.stats.nodes} 用时${(Number(m.stats.time) / 1000).toFixed(1)}s 评分${m.stats.score}]`;
                }
                record += line + '\n';
            }
            // 末尾事件（悔棋后未再落子等）
            for (const ev of gameEvents) {
                if (ev.ply > moveHistory.length) record += `—— 其后：${ev.desc} ——\n`;
            }
            
            // 复制到剪贴板
            navigator.clipboard.writeText(record).then(() => {
                const btn = document.getElementById('copy-record-btn');
                const originalText = btn.textContent;
                btn.textContent = '已复制';
                btn.style.background = '#4CAF50';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            }).catch(() => {
                // 降级方案：使用 textarea
                const textarea = document.createElement('textarea');
                textarea.value = record;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                const btn = document.getElementById('copy-record-btn');
                const originalText = btn.textContent;
                btn.textContent = '已复制';
                btn.style.background = '#4CAF50';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 2000);
            });
        });
        
        document.getElementById('pause-btn').addEventListener('click', function() {
            aiVsAIPaused = !aiVsAIPaused;
            this.textContent = aiVsAIPaused ? '继续' : '暂停';
            
            if (!aiVsAIPaused && gameMode === 'ai-vs-ai' && gameState === 'playing') {
                setTimeout(aiMove, aiVsAISpeed);
            }
        });
        
        document.getElementById('speed-up-btn').addEventListener('click', function() {
            // 循环切换速度
            const speeds = [2000, 1000, 500, 200, 100];
            const currentIdx = speeds.indexOf(aiVsAISpeed);
            const nextIdx = (currentIdx + 1) % speeds.length;
            aiVsAISpeed = speeds[nextIdx];
            document.getElementById('speed-slider').value = aiVsAISpeed;
            document.getElementById('speed-value').textContent = aiVsAISpeed;
            this.textContent = aiVsAISpeed + 'ms';
        });
        
        // ============= 初始化 =============
        function onModuleReady() {
            if (moduleReady) return;  // 两种就绪路径可能同时到达
            moduleReady = true;
            newGame();
        }

        // 先按视口尺寸初始化棋盘，引擎就绪后再重绘棋子
        resizeBoard();

        // 引擎若在上面的桥接之前就绪，这里补一次；否则由桥接回调触发。
        window.__engineReadyHook = onModuleReady;
        if (window.__engineReady ||
            (typeof Module !== 'undefined' && typeof Module._getCell === 'function')) {
            onModuleReady();
        }
    </script>
</body>
</html>
